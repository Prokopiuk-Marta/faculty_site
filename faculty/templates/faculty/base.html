{% load static %}
<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Факультет природничих наук НаУКМА{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'faculty/style.css' %}">
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <a class="logo" href="{% url 'faculty:index' %}">ФПрН НаУКМА</a>
        <nav class="menu">
          <a href="{% url 'faculty:index' %}">Головна</a>
          <a href="{% url 'faculty:departments' %}">Кафедри</a>
          <a href="{% url 'faculty:programs' %}">Спеціальності</a>
          <a href="{% url 'faculty:exchange' %}">Обмін</a>
        </nav>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">
      <div class="container">Факультет природничих наук, Національний університет «Києво-Могилянська академія»</div>
    </footer>
  </body>
</html>
